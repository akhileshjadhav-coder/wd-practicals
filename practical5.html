<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Organic Food Co.</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero {
            background: url('farm.jpg') no-repeat center center/cover;
            height: 400px;
        }
    </style>
</head>

<body>
    <!-- 1. Navbar -->
    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Organic Food Co.</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- 2. Hero Section -->
    <div class="hero d-flex align-items-center">
        <div class="container text-center text-white">
            <h1 class="fw-bold">Welcome to Organic Food Co.</h1>
            <p>Fresh & Healthy Organic Products</p>
            <button class="btn btn-success">Learn More</button>
        </div>
    </div>
    <!-- 3. Features Section -->
    <div class="container py-4">
        <div class="row text-center">
            <div class="col-md-4">
                <h5>
                    🌿
                    100% Organic</h5>
            </div>
            <div class="col-md-4">
                <h5>
                    💚
                    Healthy & Nutritious</h5>
            </div>
            <div class="col-md-4">
                <h5>
                    🚚
                    Farm Fresh Delivery</h5>
            </div>
        </div>
    </div>
    <!-- 4. Products Section -->
    <div class="container py-4">
        <h2 class="text-center mb-4">Our Products</h2>
        <div class="row">
            <!-- 5. Card 1 -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <img src="veggies.jpg" class="card-img-top">
                    <div class="card-body text-center">
                        <h5>Organic Vegetables</h5>
                        <button class="btn btn-success">Read More</button>
                    </div>
                </div>
            </div>
            <!-- 5. Card 2 -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <img src="dairy.jpg" class="card-img-top">
                    <div class="card-body text-center">
                        <h5>Dairy Products</h5>
                        <button class="btn btn-success">Read More</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script > 
</body> 
</html>
