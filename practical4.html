<!DOCTYPE html>
<html>
<head>
    <title>CSS Types Example</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Inline CSS -->
    <h1 style="color:red; text-align:center;">Student Details</h1>

    <h2>Marks Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Anita</td>
            <td>90</td>
        </tr>
    </table>

</body>
</html>
